[project]
name = "ouvindo-o-gol"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
]

[project.optional-dependencies]
cp3 = ["lightgbm", "scikit-learn", "torch", "pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lento: usa dados locais do CP2 ou treino real"]
